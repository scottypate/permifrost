.build_base:
  extends: .docker_build
  stage: build-base
  variables:
    DOCKERFILE: docker/base/Dockerfile
    IMAGE_NAME: $CI_REGISTRY_IMAGE/base
  before_script:
    # REF_SLUG, not REF_NAME: Docker tags cannot contain the `/` that appears in
    # branch names like `fix/some-bug`.
    - export IMAGE_TAG=$CI_COMMIT_REF_SLUG

# the permifrost base should only be rebuild when the `requirements.txt` file
# has a change, and should be inferable from the `BASE_SHA` environment
# variable

# Manages:
#  - gitlab-data/permifrost/base:<base_sha>
permifrost_base:
  extends: .build_base
  only:
    changes:
      - docker/base/Dockerfile
      - requirements.txt

# Manages:
#  - gitlab-data/permifrost/base:<base_sha>
permifrost_base_forks:
  extends: .build_base
  except:
    - branches@gitlab-data/permifrost
