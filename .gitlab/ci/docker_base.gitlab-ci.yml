.build_base:
  extends: .docker_build
  stage: build-base
  variables:
    DOCKERFILE: docker/base/Dockerfile
    IMAGE_NAME: $CI_REGISTRY_IMAGE/base
  before_script:
    # REF_SLUG, not REF_NAME: Docker tags cannot contain the `/` that appears in
    # branch names like `fix/some-bug`.
    - export IMAGE_TAG=$CI_COMMIT_REF_SLUG

# Runs unconditionally: build-permifrost always builds FROM base:<ref_slug>, so
# skipping this job when `requirements.txt` is unchanged leaves that tag missing
# and fails the pipeline. `only: changes` appeared to work only because it
# evaluates true on a branch's first push, when there is no diff to compute.

# Manages:
#  - gitlab-data/permifrost/base:<ref_slug>
permifrost_base:
  extends: .build_base
